<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sofá Clean — Painel de Comissões</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
:root{
  --ink:#0F1115;--ink-soft:#1E2126;--paper:#F2F3EE;--card:#FFFFFF;--line:#DEDCD2;
  --gold:#3D86A8;--gold-soft:#DCEFF6;--brand-light:#9BD3EA;
  --pending:#C0712B;--pending-soft:#F5E2CD;--paid:#2E6F4E;--paid-soft:#DBEBE1;
  --danger:#A8392F;--danger-soft:#F4DEDB;--text:#1A2226;--text-muted:#6C7479;
  --radius:12px;--shadow:0 2px 14px rgba(22,38,46,0.07);
}
*{box-sizing:border-box;}body{margin:0;}
#root,#app{font-family:'Inter',sans-serif;color:var(--text);background:var(--paper);min-height:100%;line-height:1.45;}
h1,h2,h3{font-family:'Fraunces',serif;margin:0;color:var(--ink);}
.mono{font-family:'IBM Plex Mono',monospace;}a{color:inherit;}
button{font-family:inherit;cursor:pointer;}input,select,textarea{font-family:inherit;font-size:14px;}
*:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
@media(prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}
.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.loading-text{color:var(--text-muted);font-size:14px;}
.auth-shell{width:100%;max-width:880px;min-height:520px;display:flex;border-radius:18px;overflow:hidden;box-shadow:0 10px 40px rgba(22,38,46,0.18);background:var(--card);}
.auth-brand{flex:1;background:var(--ink);color:#E6EEF2;padding:48px 40px;display:flex;flex-direction:column;justify-content:space-between;background-image:repeating-linear-gradient(to bottom,transparent,transparent 27px,rgba(155,211,234,0.07) 28px);}
.brand-eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand-light);font-weight:700;margin-bottom:14px;}
.brand-logo-img{max-width:190px;height:auto;display:block;margin-bottom:18px;}
.auth-brand .brand-tag{font-size:14px;color:#AFC6CF;max-width:280px;margin-top:14px;}
.auth-brand .brand-foot{font-size:12px;color:#7D929B;}
.auth-form-side{flex:1;padding:48px 40px;display:flex;flex-direction:column;justify-content:center;}
.auth-tabs{display:flex;gap:4px;margin-bottom:28px;background:var(--paper);border-radius:999px;padding:4px;width:fit-content;}
.auth-tab{border:none;background:transparent;padding:8px 18px;border-radius:999px;font-size:13px;font-weight:600;color:var(--text-muted);}
.auth-tab.active{background:var(--ink);color:#fff;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.field label{font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;}
.field input,.field select,.field textarea{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);}
.field-row{display:flex;gap:12px;}.field-row .field{flex:1;}
.btn-primary{background:var(--ink);color:#fff;border:none;padding:12px 20px;border-radius:8px;font-weight:600;font-size:14px;}
.btn-primary:hover{background:var(--ink-soft);}.btn-primary:disabled{opacity:.6;cursor:not-allowed;}
.btn-ghost{background:transparent;border:1px solid var(--line);padding:10px 16px;border-radius:8px;font-weight:600;font-size:13px;color:var(--text);}
.btn-ghost:hover{border-color:var(--ink);}
.btn-danger{background:var(--danger);color:#fff;border:none;padding:10px 16px;border-radius:8px;font-weight:600;font-size:13px;}
.btn-small{padding:6px 12px;font-size:12px;border-radius:6px;}
.error-text{color:var(--danger);font-size:13px;min-height:18px;margin-top:-4px;margin-bottom:8px;}
.app-header{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:var(--ink);color:#E6EEF2;}
.header-brand{display:flex;align-items:center;gap:12px;}
.header-logo{height:30px;width:auto;display:block;}
.app-header .who{font-size:13px;color:#AFC6CF;}
.header-actions{display:flex;gap:10px;align-items:center;}
.icon-btn{background:transparent;border:1px solid rgba(230,238,242,0.3);color:#E6EEF2;padding:7px 12px;border-radius:7px;font-size:13px;font-weight:600;}
.icon-btn:hover{background:rgba(230,238,242,0.1);}
.nav-tabs{display:flex;gap:4px;padding:10px 24px 0;background:var(--paper);overflow-x:auto;border-bottom:1px solid var(--line);}
.nav-tab{border:none;background:transparent;padding:10px 16px;font-size:14px;font-weight:600;color:var(--text-muted);border-bottom:2px solid transparent;white-space:nowrap;}
.nav-tab.active{color:var(--ink);border-bottom-color:var(--gold);}
.view-content{padding:24px 28px 60px;max-width:1100px;margin:0 auto;}
.section-title{margin-bottom:4px;}.section-sub{color:var(--text-muted);font-size:13px;margin-bottom:20px;}
.cards-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
.stub-card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:var(--radius);border-bottom-style:dashed;border-bottom-width:2px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;}
.stub-card.c-pending{border-left-color:var(--pending);}.stub-card.c-paid{border-left-color:var(--paid);}.stub-card.c-gold{border-left-color:var(--gold);}
.stub-card .eyebrow{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);font-weight:700;}
.stub-card .amount{font-family:'IBM Plex Mono',monospace;font-size:25px;font-weight:600;color:var(--ink);}
.stub-card .sub{font-size:12px;color:var(--text-muted);}
.ranking-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);}
.rank-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.rank-name{flex:0 0 150px;font-size:13px;font-weight:600;}
.rank-track{flex:1;height:8px;background:var(--pending-soft);border-radius:999px;overflow:hidden;}
.rank-bar{height:100%;background:var(--pending);border-radius:999px;}
.rank-value{flex:0 0 90px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13px;}
.empty-state{color:var(--text-muted);font-size:13px;padding:18px 0;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);margin-bottom:20px;}
.preview-box{display:flex;justify-content:space-between;align-items:center;background:var(--gold-soft);border-radius:8px;padding:12px 16px;margin:6px 0 18px;}
.preview-box .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);font-weight:700;}
.preview-box .amount{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;color:var(--ink);}
.filters-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:flex-end;}
.filters-row .field{margin-bottom:0;min-width:150px;}
.table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:700px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;}
tr:last-child td{border-bottom:none;}td.wrap{white-space:normal;max-width:220px;}
.amount-cell{font-family:'IBM Plex Mono',monospace;font-weight:600;}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em;}
.badge-pendente{background:var(--pending-soft);color:var(--pending);}
.badge-pago{background:var(--paid-soft);color:var(--paid);}
.badge-inativo{background:#E7E5DB;color:var(--text-muted);}
.row-actions{display:flex;gap:6px;}
.modal-overlay{position:fixed;inset:0;background:rgba(22,38,46,0.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
.modal-box{background:var(--card);border-radius:14px;padding:26px 26px 22px;max-width:500px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.25);max-height:90vh;overflow-y:auto;}
.modal-box h3{margin-bottom:14px;}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
.modal-text{font-size:14px;color:var(--text);}
#toast-container{position:fixed;top:18px;right:18px;z-index:100;display:flex;flex-direction:column;gap:8px;}
.toast{padding:11px 16px;border-radius:8px;font-size:13px;font-weight:600;color:#fff;background:var(--ink);box-shadow:0 6px 20px rgba(0,0,0,0.18);transform:translateX(0);opacity:1;transition:transform .25s,opacity .25s;}
.toast-success{background:var(--paid);}.toast-error{background:var(--danger);}.toast-info{background:var(--ink-soft);}
.toast-out{transform:translateX(20px);opacity:0;}
@media(max-width:860px){.cards-row{grid-template-columns:repeat(2,1fr);}}
@media(max-width:720px){.auth-shell{flex-direction:column;min-height:0;}.auth-brand,.auth-form-side{padding:32px 28px;}.field-row{flex-direction:column;}.view-content{padding:18px 14px 50px;}.app-header{padding:14px 16px;}}
@media(max-width:520px){.cards-row{grid-template-columns:1fr;}}
</style>
</head>

/* ===== JSONBin cloud storage ===== */
const JSONBIN_BASE='https://api.jsonbin.io/v3/b';
const cloud={
  getBinId(){
    try{ const p=new URLSearchParams(window.location.hash.slice(1)); const h=p.get('bin'); if(h) return h; }catch(e){}
    try{ return localStorage.getItem('sofa_bin')||null; }catch(e){ return null; }
  },
  getApiKey(){ try{ return localStorage.getItem('sofa_apikey')||null; }catch(e){ return null; } },
  saveBinId(id){
    try{ localStorage.setItem('sofa_bin',id); }catch(e){}
    try{ const p=new URLSearchParams(window.location.hash.slice(1)); p.set('bin',id); history.replaceState(null,'','#'+p.toString()); }catch(e){}
  },
  saveApiKey(k){ try{ localStorage.setItem('sofa_apikey',k); }catch(e){} },
  removeApiKey(){ try{ localStorage.removeItem('sofa_apikey'); }catch(e){} },
  async read(){
    const bid=this.getBinId(); if(!bid) throw {code:'NO_BIN'};
    const h={'X-Bin-Meta':'false'}; const k=this.getApiKey(); if(k) h['X-Access-Key']=k;
    const r=await fetch(`${JSONBIN_BASE}/${bid}/latest`,{headers:h});
    if(r.status===401) throw {code:'UNAUTHORIZED'}; if(!r.ok) throw {code:'READ_FAIL',status:r.status};
    return r.json();
  },
  async write(data){
    const bid=this.getBinId(); const k=this.getApiKey(); if(!k) throw {code:'NO_API_KEY'};
    const r=await fetch(`${JSONBIN_BASE}/${bid}`,{method:'PUT',headers:{'Content-Type':'application/json','X-Access-Key':k},body:JSON.stringify(data)});
    if(r.status===401) throw {code:'UNAUTHORIZED'}; if(!r.ok) throw {code:'WRITE_FAIL',status:r.status};
    return r.json();
  },
  async create(apiKey,data){
    const r=await fetch(JSONBIN_BASE,{method:'POST',headers:{'Content-Type':'application/json','X-Access-Key':apiKey,'X-Bin-Name':'sofa-clean','X-Bin-Private':'false'},body:JSON.stringify(data)});
    if(r.status===401) throw {code:'INVALID_KEY'}; if(!r.ok) throw {code:'CREATE_FAIL',status:r.status};
    return (await r.json()).metadata.id;
  },
  getShareUrl(){
    const bid=this.getBinId(); if(!bid) return window.location.href;
    const p=new URLSearchParams(); p.set('bin',bid);
    return window.location.origin+window.location.pathname+'#'+p.toString();
  }
};

/* ===== helpers ===== */
function uid(p){ return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtBRL(v){ return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function fmtDate(iso){ if(!iso) return '—'; const p=iso.split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:iso; }
function currentMonthStr(){ return new Date().toISOString().slice(0,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function monthLabel(m){
  if(m==='all') return 'Todos os períodos';
  const n=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const p=m.split('-'); return `${n[parseInt(p[1],10)-1]} de ${p[0]}`;
}
function memberName(id){ const m=state.members.find(x=>x.id===id); return m?m.name:'(removido)'; }
function getMember(id){ return state.members.find(x=>x.id===id); }
function dayKey(mid,date){ return mid+'|'+date; }
function getDayStatus(key){ return state.dayStatus[key]||{status:'pendente',paidDate:null}; }
function computeDailyTotals(entries){
  const map={};
  entries.forEach(e=>{ const k=dayKey(e.memberId,e.date); if(!map[k]) map[k]={memberId:e.memberId,date:e.date,total:0,count:0}; map[k].total+=e.saleValue; map[k].count++; });
  return map;
}
function computeCommissionForTotal(total){
  const r=state.commissionRule; const met=total>=r.dailyThreshold; return {metGoal:met,value:met?total*r.percent/100:0};
}
function buildCommissionRows(entries){
  return Object.values(computeDailyTotals(entries)).map(t=>{
    const {metGoal,value}=computeCommissionForTotal(t.total);
    const k=dayKey(t.memberId,t.date); const st=getDayStatus(k);
    return {key:k,memberId:t.memberId,date:t.date,total:t.total,count:t.count,metGoal,value,status:st.status,paidDate:st.paidDate};
  });
}
function getWeekStart(d){ const dt=new Date(d+'T00:00:00'); const day=dt.getDay(); dt.setDate(dt.getDate()+(day===0?-6:1-day)); return dt.toISOString().slice(0,10); }
function getWeekEnd(w){ const d=new Date(w+'T00:00:00'); d.setDate(d.getDate()+6); return d.toISOString().slice(0,10); }
function weekLabel(w){ return `Semana de ${fmtDate(w)} a ${fmtDate(getWeekEnd(w))}`; }
function addWeeklyAccum(rows){
  const g={};
  rows.forEach(r=>{ const w=getWeekStart(r.date); r.weekStart=w; const k=r.memberId+'|'+w; if(!g[k]) g[k]=[]; g[k].push(r); });
  Object.values(g).forEach(grp=>{ grp.sort((a,b)=>a.date.localeCompare(b.date)); let run=0; grp.forEach(r=>{ run+=r.value; r.weekAccum=run; }); });
  return rows;
}
function sumCommWhere(rows,pred){ return rows.reduce((s,r)=>pred(r)?s+r.value:s,0); }

/* ===== state ===== */
let state={
  loading:true, view:'login', loginTab:'colaborador', loginError:null,
  gestorConfig:null, commissionRule:{dailyThreshold:1500,percent:2.5},
  members:[], entries:[], dayStatus:{},
  session:null, gestorTab:'visao',
  vendasFilters:{memberId:'all',month:currentMonthStr()},
  comissaoFilters:{memberId:'all',status:'all',month:currentMonthStr(),showAll:false},
  colabFilterMonth:currentMonthStr(), modal:null,
};
const hasWrite=()=>!!cloud.getApiKey();
function getCloudData(){ return {gestorConfig:state.gestorConfig,commissionRule:state.commissionRule,members:state.members,entries:state.entries,dayStatus:state.dayStatus}; }

/* ===== load / save ===== */
async function loadData(){
  state.loading=true; render();
  if(!cloud.getBinId()){ state.loading=false; state.view='cloudSetup'; render(); return; }
  try{
    const d=await cloud.read();
    state.gestorConfig=d.gestorConfig||null;
    state.commissionRule=d.commissionRule||{dailyThreshold:1500,percent:2.5};
    state.members=d.members||[]; state.entries=d.entries||[]; state.dayStatus=d.dayStatus||{};
  }catch(e){
    state.loading=false; showToast('Erro ao carregar dados. Verifique a conexão.','error'); render(); return;
  }
  state.loading=false; state.view=state.gestorConfig?'login':'setupGestor'; render();
}
async function saveAll(){
  try{ await cloud.write(getCloudData()); }
  catch(e){ showToast('Erro ao salvar. Verifique a conexão.','error'); throw e; }
}

async function saveCommissionRule(){ await saveAll(); }
async function saveMembers(){ await saveAll(); }

async function saveDayStatus(){ await saveAll(); }

/* ===== toast ===== */
function showToast(msg,type){
  const c=document.getElementById('toast-container');
  const t=document.createElement('div'); t.className='toast toast-'+(type||'info'); t.textContent=msg;
  c.appendChild(t); setTimeout(()=>{ t.classList.add('toast-out'); setTimeout(()=>t.remove(),280); },2800);
}

function handleLoginSubmit(e){
  e.preventDefault(); const form=e.target; state.loginError=null;

    else if(member&&!member.active){ state.loginError='Acesso desativado. Fale com seu gestor.'; }
    else { state.loginError='Usuário ou senha inválidos.'; }
  }
  render();
}

/* ===== visão geral ===== */
function renderVisaoGeral(){
  const month=currentMonthStr();
  const allRows=buildCommissionRows(state.entries);
  const pendenteTotal=sumCommWhere(allRows,r=>r.status==='pendente');
  const pagoMes=sumCommWhere(allRows,r=>r.status==='pago'&&r.paidDate&&r.paidDate.slice(0,7)===month);
  const vendidoMes=state.entries.filter(e=>e.date.slice(0,7)===month).reduce((s,e)=>s+e.saleValue,0);
  const lancMes=state.entries.filter(e=>e.date.slice(0,7)===month).length;
  const ranking=state.members.filter(m=>m.active).map(m=>({name:m.name,total:sumCommWhere(allRows,r=>r.memberId===m.id&&r.status==='pendente')})).filter(r=>r.total>0).sort((a,b)=>b.total-a.total);
  const maxR=Math.max(1,...ranking.map(r=>r.total));
  const rule=state.commissionRule;
  return `<h2 class="section-title">Visão geral</h2>
    <div class="section-sub">Resumo de ${monthLabel(month)} · meta diária ${fmtBRL(rule.dailyThreshold)}, comissão ${rule.percent}% sobre o total quando a meta é batida</div>
    <div class="cards-row">
      <div class="stub-card c-pending"><span class="eyebrow">Pendente (total)</span><span class="amount mono">${fmtBRL(pendenteTotal)}</span><span class="sub">a pagar para o time</span></div>
      <div class="stub-card c-paid"><span class="eyebrow">Pago no mês</span><span class="amount mono">${fmtBRL(pagoMes)}</span><span class="sub">comissões pagas</span></div>
      <div class="stub-card c-gold"><span class="eyebrow">Vendido no mês</span><span class="amount mono">${fmtBRL(vendidoMes)}</span><span class="sub">valor total</span></div>
      <div class="stub-card"><span class="eyebrow">Vendas no mês</span><span class="amount mono">${lancMes}</span><span class="sub">registradas</span></div>
    </div>
    <h3 style="margin-bottom:12px;font-size:17px;">Pendente por colaborador</h3>
    <div class="ranking-box">
      ${ranking.length===0?`<div class="empty-state">Nenhuma comissão pendente.</div>`:
        ranking.map(r=>`<div class="rank-row"><span class="rank-name">${esc(r.name)}</span><span class="rank-track"><span class="rank-bar" style="width:${(r.total/maxR*100).toFixed(0)}%"></span></span><span class="rank-value mono">${fmtBRL(r.total)}</span></div>`).join('')}
    </div>`;
}

  return `<h2 class="section-title">Lançar venda</h2>
    <div class="section-sub">Meta diária de ${fmtBRL(rule.dailyThreshold)} · ao bater a meta, a comissão de ${rule.percent}% incide sobre o total vendido no dia.</div>

      </select></div>
      <div class="field-row">

        <div class="field"><label>Valor (R$)</label><input type="number" name="valor" id="lancar-valor" min="0" step="0.01" oninput="updateLancarPreview()" required></div>
      </div>

function updateLancarPreview(){
  const mid=document.getElementById('lancar-colaborador').value;
  const date=document.getElementById('lancar-data').value||todayStr();
  const valor=parseFloat(document.getElementById('lancar-valor').value)||0;
  const el=document.getElementById('lancar-preview');
  if(!mid){el.textContent='—';return;}
  const existing=state.entries.filter(e=>e.memberId===mid&&e.date===date).reduce((s,e)=>s+e.saleValue,0);
  const total=existing+valor; const {metGoal,value}=computeCommissionForTotal(total); const rule=state.commissionRule;
  el.textContent=metGoal?`${fmtBRL(total)} no dia (meta batida) → comissão ${fmtBRL(value)}`:`${fmtBRL(total)} no dia → faltam ${fmtBRL(rule.dailyThreshold-total)} para a meta`;
}
async function handleLancarSubmit(e){
  e.preventDefault(); const form=e.target;
  const mid=form.colaborador.value; const valor=parseFloat(form.valor.value);
  if(!mid){showToast('Selecione um colaborador.','error');return;}
  if(!(valor>0)){showToast('Informe um valor válido.','error');return;}
  const btn=document.getElementById('lancar-btn'); btn.textContent='Salvando…'; btn.disabled=true;
  const entry={id:uid('e'),memberId:mid,date:form.data.value||todayStr(),description:form.descricao.value.trim(),saleValue:valor,notes:form.obs.value.trim(),createdAt:new Date().toISOString()};
  state.entries.unshift(entry);
  try{ await saveEntries(); showToast('Venda lançada.','success'); form.valor.value=''; form.descricao.value=''; form.obs.value=''; updateLancarPreview(); }
  catch(err){ state.entries.shift(); showToast('Erro ao salvar.','error'); }
  btn.textContent='Lançar venda'; btn.disabled=false;
}

/* ===== vendas ===== */
function getAvailableMonths(){ return Array.from(new Set(state.entries.map(e=>e.date.slice(0,7)))).sort().reverse(); }
function getFilteredVendas(){
  let list=state.entries.slice();
  if(state.vendasFilters.memberId!=='all') list=list.filter(e=>e.memberId===state.vendasFilters.memberId);
  if(state.vendasFilters.month!=='all') list=list.filter(e=>e.date.slice(0,7)===state.vendasFilters.month);
  return list.sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt));

function renderVendas(){
  const months=getAvailableMonths(); const list=getFilteredVendas(); const ro=!hasWrite();

    </div>

      <thead><tr><th>Data</th><th>Colaborador</th><th>Descrição</th><th>Venda</th>${ro?'':'<th>Ações</th>'}</tr></thead>
      <tbody>${list.length===0?`<tr><td colspan="${ro?4:5}"><div class="empty-state">Nenhuma venda encontrada.</div></td></tr>`:
        list.map(e=>`<tr><td>${fmtDate(e.date)}</td><td>${esc(memberName(e.memberId))}</td><td class="wrap">${esc(e.description)||'—'}</td><td class="amount-cell">${fmtBRL(e.saleValue)}</td>${ro?'':` <td><div class="row-actions"><button class="btn-ghost btn-small" onclick="openEditEntry('${e.id}')">Editar</button><button class="btn-ghost btn-small" onclick="confirmDeleteEntry('${e.id}')">Excluir</button></div></td>`}</tr>`).join('')}

}
function onVendasFilterChange(){ state.vendasFilters.memberId=document.getElementById('vendas-filter-member').value; state.vendasFilters.month=document.getElementById('vendas-filter-month').value; render(); }
function downloadCSV(rows,filename){ const csv=rows.map(r=>r.map(f=>'"'+String(f).replace(/"/g,'""')+'"').join(';')).join('\n'); const b=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(u); }
function exportVendasCSV(){ const l=getFilteredVendas(); const r=[['Data','Colaborador','Descricao','Valor']]; l.forEach(e=>r.push([e.date,memberName(e.memberId),e.description||'',e.saleValue.toFixed(2).replace('.',',')])); downloadCSV(r,'vendas_'+(state.vendasFilters.month==='all'?'todos':state.vendasFilters.month)+'.csv'); }
function openEditEntry(id){ state.modal={type:'editEntry',id}; render(); }
function confirmDeleteEntry(id){ state.modal={type:'confirm',message:'Excluir esta venda? Isso altera a comissão do dia.',onConfirm:'deleteEntry',payload:id}; render(); }
async function deleteEntry(id){
  const idx=state.entries.findIndex(x=>x.id===id); const removed=state.entries.splice(idx,1)[0];
  try{ await saveEntries(); state.modal=null; render(); showToast('Venda excluída.','info'); }
  catch(err){ state.entries.splice(idx,0,removed); showToast('Erro ao excluir.','error'); }
}
async function handleEditEntrySubmit(e){
  e.preventDefault(); const form=e.target;
  const entry=state.entries.find(x=>x.id===state.modal.id); if(!entry) return;
  const valor=parseFloat(form.valor.value);
  if(!(valor>0)){document.getElementById('editentry-error').textContent='Informe um valor válido.';return;}
  const prev={...entry};
  entry.date=form.data.value||entry.date; entry.description=form.descricao.value.trim(); entry.saleValue=valor; entry.notes=form.obs.value.trim();
  try{ await saveEntries(); state.modal=null; render(); showToast('Venda atualizada.','success'); }
  catch(err){ Object.assign(entry,prev); showToast('Erro ao salvar.','error'); }
}

/* ===== comissões ===== */
function getFilteredComissaoRows(){
  let rows=buildCommissionRows(state.entries); addWeeklyAccum(rows);
  if(!state.comissaoFilters.showAll) rows=rows.filter(r=>r.value>0);
  if(state.comissaoFilters.memberId!=='all') rows=rows.filter(r=>r.memberId===state.comissaoFilters.memberId);
  if(state.comissaoFilters.status!=='all') rows=rows.filter(r=>r.status===state.comissaoFilters.status);
  if(state.comissaoFilters.month!=='all') rows=rows.filter(r=>r.date.slice(0,7)===state.comissaoFilters.month);
  return rows.sort((a,b)=>b.date.localeCompare(a.date));
}
function renderComissoes(){
  const months=getAvailableMonths(); const rows=getFilteredComissaoRows(); const rule=state.commissionRule; const ro=!hasWrite();
  return `<h2 class="section-title">Comissões</h2>
    <div class="section-sub">Meta diária de ${fmtBRL(rule.dailyThreshold)} · comissão ${rule.percent}% sobre o total vendido no dia quando a meta é batida.</div>
    <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
      <div><div class="eyebrow" style="margin-bottom:4px;">Regra atual</div><div style="font-size:14px;">Meta diária <strong class="mono">${fmtBRL(rule.dailyThreshold)}</strong> · comissão <strong class="mono">${rule.percent}%</strong> sobre o total do dia</div></div>
      ${ro?'':` <button class="btn-ghost" onclick="openEditRule()">Editar regra</button>`}
    </div>
    <div class="filters-row">
      <div class="field"><label>Colaborador</label><select id="com-filter-member" onchange="onComissaoFilterChange()"><option value="all">Todos</option>${state.members.map(m=>`<option value="${m.id}" ${state.comissaoFilters.memberId===m.id?'selected':''}>${esc(m.name)}${!m.active?' (inativo)':''}</option>`).join('')}</select></div>
      <div class="field"><label>Status</label><select id="com-filter-status" onchange="onComissaoFilterChange()"><option value="all" ${state.comissaoFilters.status==='all'?'selected':''}>Todos</option><option value="pendente" ${state.comissaoFilters.status==='pendente'?'selected':''}>Pendente</option><option value="pago" ${state.comissaoFilters.status==='pago'?'selected':''}>Pago</option></select></div>
      <div class="field"><label>Período</label><select id="com-filter-month" onchange="onComissaoFilterChange()"><option value="all" ${state.comissaoFilters.month==='all'?'selected':''}>Todos</option>${months.map(m=>`<option value="${m}" ${state.comissaoFilters.month===m?'selected':''}>${monthLabel(m)}</option>`).join('')}</select></div>
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted);padding-bottom:10px;"><input type="checkbox" id="com-filter-showall" ${state.comissaoFilters.showAll?'checked':''} onchange="onComissaoFilterChange()"> mostrar dias sem comissão</label>
      <button class="btn-ghost" onclick="exportComissoesCSV()">Exportar CSV</button>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Data</th><th>Colaborador</th><th>Vendido no dia</th><th>Meta</th><th>Comissão</th><th>Acumulado semana</th><th>Status</th>${ro?'':'<th>Ações</th>'}</tr></thead>
      <tbody>${rows.length===0?`<tr><td colspan="${ro?7:8}"><div class="empty-state">Nenhuma comissão encontrada.</div></td></tr>`:
        rows.map(r=>`<tr>
          <td>${fmtDate(r.date)}</td>
          <td>${esc(memberName(r.memberId))} <span style="color:var(--text-muted);font-size:11px;">(${r.count} venda${r.count>1?'s':''})</span></td>
          <td class="amount-cell">${fmtBRL(r.total)}</td>
          <td><span class="badge ${r.metGoal?'badge-pago':'badge-inativo'}">${r.metGoal?'batida':'não batida'}</span></td>
          <td class="amount-cell">${fmtBRL(r.value)}</td>
          <td class="amount-cell">${fmtBRL(r.weekAccum)}</td>
          <td><span class="badge badge-${r.status}">${r.status}</span></td>
          ${ro?'':` <td><button class="btn-ghost btn-small" onclick="toggleDayStatus('${r.memberId}','${r.date}')">${r.status==='pendente'?'Marcar pago':'Reabrir'}</button></td>`}
        </tr>`).join('')}
      </tbody>
    </table></div>`;
}
function onComissaoFilterChange(){ state.comissaoFilters.memberId=document.getElementById('com-filter-member').value; state.comissaoFilters.status=document.getElementById('com-filter-status').value; state.comissaoFilters.month=document.getElementById('com-filter-month').value; state.comissaoFilters.showAll=document.getElementById('com-filter-showall').checked; render(); }
function exportComissoesCSV(){ const rows=getFilteredComissaoRows(); const out=[['Data','Colaborador','Vendido','Meta','Comissao','Acum.Semana','Status']]; rows.forEach(r=>out.push([r.date,memberName(r.memberId),r.total.toFixed(2).replace('.',','),r.metGoal?'Sim':'Nao',r.value.toFixed(2).replace('.',','),r.weekAccum.toFixed(2).replace('.',','),r.status])); downloadCSV(out,'comissoes_'+(state.comissaoFilters.month==='all'?'todos':state.comissaoFilters.month)+'.csv'); }
async function toggleDayStatus(mid,date){
  const key=dayKey(mid,date); const cur=getDayStatus(key); const prev={...state.dayStatus};
  if(cur.status==='pendente') state.dayStatus[key]={status:'pago',paidDate:todayStr()};
  else delete state.dayStatus[key];
  try{ await saveDayStatus(); render(); showToast(state.dayStatus[key]?'Marcado como pago.':'Reaberto.','success'); }
  catch(err){ state.dayStatus=prev; showToast('Erro ao salvar.','error'); }
}
function openEditRule(){ state.modal={type:'editRule'}; render(); }
async function handleEditRuleSubmit(e){
  e.preventDefault(); const form=e.target;
  const threshold=parseFloat(form.threshold.value); const percent=parseFloat(form.percent.value);
  if(!(threshold>=0)||!(percent>=0)){document.getElementById('editrule-error').textContent='Informe valores válidos.';return;}
  const prev={...state.commissionRule}; state.commissionRule={dailyThreshold:threshold,percent:percent};
  try{ await saveCommissionRule(); state.modal=null; render(); showToast('Regra atualizada.','success'); }
  catch(err){ state.commissionRule=prev; showToast('Erro ao salvar.','error'); }
}

/* ===== colaboradores ===== */
function renderColaboradores(){
  const ro=!hasWrite();
  return `<h2 class="section-title">Colaboradores</h2>
    <div class="section-sub">Gerencie o time e os acessos ao painel.</div>
    ${ro?'<div style="background:var(--pending-soft);border-left:3px solid var(--pending);border-radius:8px;padding:12px 16px;font-size:13px;color:var(--pending);margin-bottom:16px;">Modo somente leitura. <button class="btn-ghost btn-small" onclick="state.view=\'setupApiKey\';render()">Ativar edição</button></div>':`
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:14px;">Adicionar colaborador</h3>
      <form onsubmit="handleAddMemberSubmit(event)">
        <div class="field-row">
          <div class="field"><label>Nome completo</label><input type="text" name="nome" required></div>
          <div class="field"><label>Usuário (login)</label><input type="text" name="username" required></div>
        </div>
        <div class="field"><label>Senha inicial</label><input type="password" name="senha" minlength="4" required></div>
        <div class="error-text" id="member-error"></div>
        <button type="submit" class="btn-primary">Adicionar colaborador</button>
      </form>
    </div>`}
    <div class="table-wrap"><table>
      <thead><tr><th>Nome</th><th>Usuário</th><th>Status</th>${ro?'':'<th>Ações</th>'}</tr></thead>
      <tbody>${state.members.length===0?`<tr><td colspan="${ro?3:4}"><div class="empty-state">Nenhum colaborador cadastrado.</div></td></tr>`:
        state.members.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.username)}</td><td><span class="badge ${m.active?'badge-pago':'badge-inativo'}">${m.active?'ativo':'inativo'}</span></td>${ro?'':` <td><div class="row-actions"><button class="btn-ghost btn-small" onclick="openEditMember('${m.id}')">Editar</button><button class="btn-ghost btn-small" onclick="openResetPassword('${m.id}')">Redefinir senha</button><button class="btn-ghost btn-small" onclick="toggleMemberActive('${m.id}')">${m.active?'Desativar':'Ativar'}</button></div></td>`}</tr>`).join('')}
      </tbody>
    </table></div>`;
}
async function handleAddMemberSubmit(e){
  e.preventDefault(); const form=e.target;
  const nome=form.nome.value.trim(); const username=form.username.value.trim().toLowerCase(); const senha=form.senha.value;
  const errEl=document.getElementById('member-error'); errEl.textContent='';
  if(!nome||!username||!senha){errEl.textContent='Preencha todos os campos.';return;}
  if(senha.length<4){errEl.textContent='Senha precisa ter ao menos 4 caracteres.';return;}
  if(state.members.some(m=>m.username.toLowerCase()===username)){errEl.textContent='Usuário já existe.';return;}
  const member={id:uid('m'),name:nome,username,password:senha,active:true,createdAt:new Date().toISOString()};
  state.members.push(member);
  try{ await saveMembers(); render(); showToast('Colaborador adicionado.','success'); }
  catch(err){ state.members.pop(); showToast('Erro ao salvar.','error'); }
}
function openEditMember(id){ state.modal={type:'editMember',id}; render(); }
async function handleEditMemberSubmit(e){
  e.preventDefault(); const form=e.target; const member=state.members.find(m=>m.id===state.modal.id); if(!member) return;
  const username=form.username.value.trim().toLowerCase();
  if(state.members.some(m=>m.id!==member.id&&m.username.toLowerCase()===username)){document.getElementById('editmember-error').textContent='Usuário já existe.';return;}
  const prev={...member}; member.name=form.nome.value.trim(); member.username=username;
  try{ await saveMembers(); state.modal=null; render(); showToast('Colaborador atualizado.','success'); }
  catch(err){ Object.assign(member,prev); showToast('Erro ao salvar.','error'); }
}
async function toggleMemberActive(id){
  const member=state.members.find(m=>m.id===id); if(!member) return; member.active=!member.active;
  try{ await saveMembers(); render(); showToast(member.active?'Ativado.':'Desativado.','info'); }
  catch(err){ member.active=!member.active; showToast('Erro ao salvar.','error'); }
}
function openResetPassword(id){ state.modal={type:'resetPassword',id}; render(); }
async function handleResetPasswordSubmit(e){
  e.preventDefault(); const form=e.target; const member=state.members.find(m=>m.id===state.modal.id); if(!member) return;
  const nova=form.novaSenha.value;
  if(nova.length<4){document.getElementById('resetpw-error').textContent='Ao menos 4 caracteres.';return;}
  const prev=member.password; member.password=nova;
  try{ await saveMembers(); state.modal=null; render(); showToast('Senha redefinida.','success'); }
  catch(err){ member.password=prev; showToast('Erro ao salvar.','error'); }
}

/* ===== modais ===== */
function closeModal(){ state.modal=null; render(); }
function renderModalOverlay(){
  if(!state.modal) return '';
  let inner='';
  if(state.modal.type==='editEntry') inner=renderEditEntryModal();
  else if(state.modal.type==='editMember') inner=renderEditMemberModal();
  else if(state.modal.type==='resetPassword') inner=renderResetPasswordModal();
  else if(state.modal.type==='editRule') inner=renderEditRuleModal();
  else if(state.modal.type==='confirm') inner=renderConfirmModal();
  else if(state.modal.type==='shareUrl') inner=renderShareUrlModal();
  return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-box">${inner}</div></div>`;
}
function renderEditEntryModal(){
  const entry=state.entries.find(x=>x.id===state.modal.id); if(!entry) return '';
  return `<h3>Editar venda — ${esc(memberName(entry.memberId))}</h3>
  <form onsubmit="handleEditEntrySubmit(event)">
    <div class="field-row"><div class="field"><label>Data</label><input type="date" name="data" value="${entry.date}" required></div><div class="field"><label>Valor (R$)</label><input type="number" name="valor" min="0" step="0.01" value="${entry.saleValue}" required></div></div>
    <div class="field"><label>Descrição</label><input type="text" name="descricao" maxlength="120" value="${esc(entry.description)}"></div>
    <div class="field"><label>Observações</label><textarea name="obs" rows="2" maxlength="300">${esc(entry.notes)}</textarea></div>
    <div class="error-text" id="editentry-error"></div>
    <div class="modal-actions"><button type="button" class="btn-ghost" onclick="closeModal()">Cancelar</button><button type="submit" class="btn-primary">Salvar</button></div>
  </form>`;
}
function renderEditMemberModal(){
  const m=state.members.find(x=>x.id===state.modal.id); if(!m) return '';
  return `<h3>Editar colaborador</h3>
  <form onsubmit="handleEditMemberSubmit(event)">
    <div class="field"><label>Nome completo</label><input type="text" name="nome" value="${esc(m.name)}" required></div>
    <div class="field"><label>Usuário (login)</label><input type="text" name="username" value="${esc(m.username)}" required></div>
    <div class="error-text" id="editmember-error"></div>
    <div class="modal-actions"><button type="button" class="btn-ghost" onclick="closeModal()">Cancelar</button><button type="submit" class="btn-primary">Salvar</button></div>
  </form>`;
}
function renderResetPasswordModal(){
  const m=state.members.find(x=>x.id===state.modal.id); if(!m) return '';
  return `<h3>Redefinir senha — ${esc(m.name)}</h3>
  <form onsubmit="handleResetPasswordSubmit(event)">
    <div class="field"><label>Nova senha</label><input type="password" name="novaSenha" minlength="4" required></div>
    <div class="error-text" id="resetpw-error"></div>
    <div class="modal-actions"><button type="button" class="btn-ghost" onclick="closeModal()">Cancelar</button><button type="submit" class="btn-primary">Salvar</button></div>
  </form>`;
}
function renderEditRuleModal(){
  const rule=state.commissionRule;
  return `<h3>Editar regra de comissão</h3>
  <form onsubmit="handleEditRuleSubmit(event)">
    <div class="field"><label>Meta diária (R$)</label><input type="number" name="threshold" min="0" step="0.01" value="${rule.dailyThreshold}" required></div>
    <div class="field"><label>Comissão sobre o total do dia (%)</label><input type="number" name="percent" min="0" step="0.01" value="${rule.percent}" required></div>
    <div class="error-text" id="editrule-error"></div>
    <div class="modal-actions"><button type="button" class="btn-ghost" onclick="closeModal()">Cancelar</button><button type="submit" class="btn-primary">Salvar</button></div>
  </form>`;
}
function renderShareUrlModal(){
  const url=cloud.getShareUrl();
  return `<h3>Link do painel</h3>
  <p class="modal-text" style="margin-bottom:14px;">Copie e envie este link para o time via WhatsApp. Cada um acessa com seu usuário e senha.</p>
  <div style="background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:12px;word-break:break-all;font-family:monospace;margin-bottom:6px;">${esc(url)}</div>
  <p style="font-size:12px;color:var(--text-muted);margin-bottom:16px;">Guarde também sua chave de API JSONBin em local seguro — ela é necessária em novos dispositivos.</p>
  <div class="modal-actions">
    <button class="btn-ghost" onclick="closeModal()">Fechar</button>
    <button class="btn-primary" onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(url)}').then(()=>showToast('Link copiado!','success'))">Copiar link</button>
  </div>`;
}
function renderConfirmModal(){
  return `<h3>Confirmar ação</h3><p class="modal-text">${esc(state.modal.message)}</p>
  <div class="modal-actions"><button class="btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn-danger" onclick="${state.modal.onConfirm}('${state.modal.payload}')">Excluir</button></div>`;
}

/* ===== colaborador app ===== */
function renderColaboradorApp(){
  const member=getMember(state.session.memberId);
  if(!member) return `<div class="center-screen"><div><p>Cadastro não encontrado.</p><button class="btn-ghost" onclick="handleLogout()">Voltar</button></div></div>`;
  const myAll=state.entries.filter(e=>e.memberId===member.id);
  const allRows=buildCommissionRows(myAll); addWeeklyAccum(allRows);
  const months=Array.from(new Set(myAll.map(e=>e.date.slice(0,7)))).sort().reverse();
  const month=state.colabFilterMonth;
  const rows=(month==='all'?allRows:allRows.filter(r=>r.date.slice(0,7)===month)).sort((a,b)=>b.date.localeCompare(a.date));
  const pendenteTotal=sumCommWhere(allRows,r=>r.status==='pendente');
  const pagoPeriodo=sumCommWhere(month==='all'?allRows:rows,r=>r.status==='pago');
  const vendidoPeriodo=(month==='all'?myAll:myAll.filter(e=>e.date.slice(0,7)===month)).reduce((s,e)=>s+e.saleValue,0);
  const rule=state.commissionRule; const thisWeek=getWeekStart(todayStr());
  const weekRows=allRows.filter(r=>r.weekStart===thisWeek);
  const weekAccum=weekRows.length?Math.max(...weekRows.map(r=>r.weekAccum)):0;
  return `<div>
    <div class="app-header">
      <div class="header-brand"><img src="${LOGO_DATA_URI}" alt="Sofá Clean" class="header-logo"><span class="who">${esc(member.name)}</span></div>
      <div class="header-actions"><button class="icon-btn" onclick="refreshData()">Atualizar</button><button class="icon-btn" onclick="handleLogout()">Sair</button></div>
    </div>
    <div class="view-content">
      <h2 class="section-title">Minhas comissões</h2>
      <div class="section-sub">Meta diária de ${fmtBRL(rule.dailyThreshold)} · comissão de ${rule.percent}% sobre o total vendido no dia quando a meta é batida.</div>
      <div class="filters-row"><div class="field"><label>Período</label><select id="colab-month" onchange="onColabMonthChange()"><option value="all" ${month==='all'?'selected':''}>Todos</option>${months.map(m=>`<option value="${m}" ${month===m?'selected':''}>${monthLabel(m)}</option>`).join('')}</select></div></div>
      <div class="cards-row">
        <div class="stub-card c-pending"><span class="eyebrow">Pendente (total)</span><span class="amount mono">${fmtBRL(pendenteTotal)}</span><span class="sub">a receber</span></div>
        <div class="stub-card c-paid"><span class="eyebrow">Pago no período</span><span class="amount mono">${fmtBRL(pagoPeriodo)}</span><span class="sub">já recebido</span></div>
        <div class="stub-card c-gold"><span class="eyebrow">Vendido no período</span><span class="amount mono">${fmtBRL(vendidoPeriodo)}</span><span class="sub">valor total</span></div>
        <div class="stub-card"><span class="eyebrow">Acumulado nesta semana</span><span class="amount mono">${fmtBRL(weekAccum)}</span><span class="sub">${weekLabel(thisWeek)}</span></div>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>Data</th><th>Vendido no dia</th><th>Meta</th><th>Comissão</th><th>Acumulado semana</th><th>Status</th></tr></thead>
        <tbody>${rows.length===0?`<tr><td colspan="6"><div class="empty-state">Nenhum dia com vendas encontrado.</div></td></tr>`:
          rows.map(r=>`<tr>
            <td>${fmtDate(r.date)} <span style="color:var(--text-muted);font-size:11px;">(${r.count} venda${r.count>1?'s':''})</span></td>
            <td class="amount-cell">${fmtBRL(r.total)}</td>
            <td><span class="badge ${r.metGoal?'badge-pago':'badge-inativo'}">${r.metGoal?'batida':'não batida'}</span></td>
            <td class="amount-cell">${fmtBRL(r.value)}</td>
            <td class="amount-cell">${fmtBRL(r.weekAccum)}</td>
            <td><span class="badge badge-${r.status}">${r.status}</span></td>
          </tr>`).join('')}
        </tbody>
      </table></div>
    </div>
  </div>`;
}
function onColabMonthChange(){ state.colabFilterMonth=document.getElementById('colab-month').value; render(); }

/* ===== init ===== */
loadData();

</script>
